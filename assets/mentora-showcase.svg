<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" role="img" aria-label="Mentora, an AI learning platform for students and their teachers: AI tutor, adaptive practice, goals and plans, progress analytics and teacher tools. Built with FastAPI, MongoDB, HTML, CSS and JavaScript, GitHub Actions and Render.">
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
  .in { opacity: 0; animation: in .6s ease-out forwards; }
  .name { font-size: 38px; font-weight: 700; fill: #ffffff; letter-spacing: -1px; }
  .tag { font-size: 15px; fill: #c7d2fe; }
  .ft { font-size: 15px; font-weight: 700; fill: #ffffff; }
  .fd { font-size: 12.5px; fill: #aab6d6; }
  .chip text { font-size: 11.5px; font-weight: 600; fill: #dbe4ff; }
  .m { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s ease-out .4s forwards; }
  .tile { animation: float 4s ease-in-out 1.5s infinite; }
  .glow { animation: breathe 6s ease-in-out infinite; }
  .win-t { font-size: 11px; fill: #8b97b5; }
  .kl { font-size: 10.5px; fill: #8b97b5; }
  .kv { font-size: 21px; font-weight: 700; fill: #ffffff; }
  .gl { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.2s ease-out forwards; }
  .q { font-size: 12.5px; font-weight: 700; fill: #e6edf3; }
  .opt text { font-size: 12px; fill: #d1d9e6; }
  .pick rect { animation: right .5s ease 3.9s forwards; }
  .tick { opacity: 0; animation: in .3s ease 4.1s forwards; }
  .fb { font-size: 11.5px; fill: #86efac; }
  .live { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: .6; } }
  @keyframes right { to { fill: #14532d; fill-opacity: .9; stroke: #22c55e; stroke-opacity: 1; } }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(1.5); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1a3f"/><stop offset=".55" stop-color="#14286b"/><stop offset="1" stop-color="#3b1a78"/>
  </linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#3b82f6" stop-opacity=".7"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#60a5fa" stop-opacity=".35"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
  </linearGradient>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".07"/></pattern>
</defs>

<rect width="840" height="440" rx="18" fill="url(#bg)"/>
<rect width="840" height="440" rx="18" fill="url(#dots)"/>
<rect x=".5" y=".5" width="839" height="439" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
<circle class="glow" cx="60" cy="60" r="90" fill="url(#halo)"/>

<!-- left: brand, features, stack -->
<g class="tile">
  <rect x="32" y="30" width="58" height="58" rx="16" fill="#2f62e8"/>
  <rect x="32.5" y="30.5" width="57" height="57" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity=".35"/>
  <path class="m" pathLength="1" d="M46 74V46l15 13.5 15-13.5v28" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text class="name in" x="106" y="72" style="animation-delay:.6s">Mentora</text>
<g class="in" style="animation-delay:.8s">
  <circle class="live" cx="268" cy="59" r="4" fill="#4ade80"/>
  <text x="278" y="63" style="font-size:12px;font-weight:600;fill:#86efac">Live</text>
</g>
<text class="tag in" x="32" y="122" style="animation-delay:.9s">AI learning platform for students and their teachers</text>

<g class="in" style="animation-delay:1.1s">
  <circle cx="47" cy="160" r="15" fill="#2563eb"/>
  <path d="M40 155h14v8h-8l-4 3v-3h-2z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
  <text class="ft" x="74" y="157">AI tutor</text>
  <text class="fd" x="74" y="174">Step-by-step answers in a full-screen chat</text>
</g>
<g class="in" style="animation-delay:1.3s">
  <circle cx="47" cy="204" r="15" fill="#059669"/>
  <circle cx="47" cy="204" r="7" fill="none" stroke="#fff" stroke-width="1.8"/><circle cx="47" cy="204" r="2.5" fill="#fff"/>
  <text class="ft" x="74" y="201">Adaptive practice</text>
  <text class="fd" x="74" y="218">Rounds that get easier or harder · 800 questions, 8 subjects</text>
</g>
<g class="in" style="animation-delay:1.5s">
  <circle cx="47" cy="248" r="15" fill="#d97706"/>
  <path d="M42 256v-16M42 241h10l-2 4 2 4H42" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="ft" x="74" y="245">Goals &amp; plans</text>
  <text class="fd" x="74" y="262">Week-by-week roadmaps that adapt to results</text>
</g>
<g class="in" style="animation-delay:1.7s">
  <circle cx="47" cy="292" r="15" fill="#db2777"/>
  <path d="M40 298l5-6 4 3 6-8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <text class="ft" x="74" y="289">Progress analytics</text>
  <text class="fd" x="74" y="306">Line graphs of real results in every subject</text>
</g>
<g class="in" style="animation-delay:1.9s">
  <circle cx="47" cy="336" r="15" fill="#7c3aed"/>
  <circle cx="44" cy="332" r="3.2" fill="none" stroke="#fff" stroke-width="1.7"/><path d="M38 343c0-4 3-6 6-6s6 2 6 6" fill="none" stroke="#fff" stroke-width="1.7"/>
  <circle cx="52" cy="331" r="2.4" fill="none" stroke="#fff" stroke-width="1.5"/>
  <text class="ft" x="74" y="333">Teachers</text>
  <text class="fd" x="74" y="350">Class codes, subject folders, quizzes and analysis</text>
</g>

<g class="chip in" style="animation-delay:2.2s">
  <rect x="32" y="380" width="66" height="26" rx="13" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/><text x="65" y="397" text-anchor="middle">FastAPI</text>
  <rect x="106" y="380" width="78" height="26" rx="13" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/><text x="145" y="397" text-anchor="middle">MongoDB</text>
  <rect x="192" y="380" width="92" height="26" rx="13" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/><text x="238" y="397" text-anchor="middle">HTML/CSS/JS</text>
  <rect x="292" y="380" width="104" height="26" rx="13" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/><text x="344" y="397" text-anchor="middle">GitHub Actions</text>
  <rect x="404" y="380" width="62" height="26" rx="13" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/><text x="435" y="397" text-anchor="middle">Render</text>
</g>

<!-- right: a small app window -->
<g class="in" style="animation-delay:.3s">
  <rect x="490" y="30" width="320" height="380" rx="14" fill="#0b1220" stroke="#ffffff" stroke-opacity=".14"/>
  <path d="M490 44a14 14 0 0 1 14-14h292a14 14 0 0 1 14 14v18H490z" fill="#111a2e"/>
  <line x1="490" x2="810" y1="62" y2="62" stroke="#ffffff" stroke-opacity=".1"/>
  <circle cx="508" cy="46" r="4.5" fill="#ff5f57"/><circle cx="523" cy="46" r="4.5" fill="#febc2e"/><circle cx="538" cy="46" r="4.5" fill="#28c840"/>
  <rect x="560" y="37" width="226" height="18" rx="9" fill="#ffffff" fill-opacity=".06"/>
  <text class="win-t" x="673" y="50" text-anchor="middle">mentora-sdlb.onrender.com/app</text>
</g>

<g class="in" style="animation-delay:.9s">
  <rect x="506" y="76" width="92" height="52" rx="9" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08"/>
  <text class="kl" x="516" y="94">Accuracy</text><text class="kv" x="516" y="119">77%</text>
  <rect x="604" y="76" width="92" height="52" rx="9" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08"/>
  <text class="kl" x="614" y="94">Questions</text><text class="kv" x="614" y="119">240</text>
  <rect x="702" y="76" width="92" height="52" rx="9" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08"/>
  <text class="kl" x="712" y="94">Streak</text><text class="kv" x="712" y="119">6 <tspan style="font-size:12px;font-weight:500;fill:#8b97b5">days</tspan></text>
</g>

<g class="in" style="animation-delay:1.2s">
  <text class="kl" x="506" y="152">Progress · last 8 weeks</text>
  <circle cx="690" cy="148" r="3.5" fill="#60a5fa"/><text class="kl" x="697" y="152">Python</text>
  <circle cx="745" cy="148" r="3.5" fill="#f59e0b"/><text class="kl" x="752" y="152">Java</text>
  <line x1="506" x2="794" y1="168" y2="168" stroke="#ffffff" stroke-opacity=".06"/>
  <line x1="506" x2="794" y1="203" y2="203" stroke="#ffffff" stroke-opacity=".06"/>
  <line x1="506" x2="794" y1="238" y2="238" stroke="#ffffff" stroke-opacity=".08"/>
</g>
<path d="M510 222 L550 214 L590 217 L630 199 L670 194 L710 186 L750 176 L790 170 L790 238 L510 238 Z" fill="url(#area)" class="in" style="animation-delay:3s"/>
<path class="gl" pathLength="1" d="M510 222 L550 214 L590 217 L630 199 L670 194 L710 186 L750 176 L790 170" stroke="#60a5fa" style="animation-delay:1.5s"/>
<path class="gl" pathLength="1" d="M510 230 L550 226 L590 219 L630 222 L670 212 L710 207 L750 201 L790 196" stroke="#f59e0b" style="animation-delay:1.9s"/>
<circle cx="790" cy="170" r="4" fill="#60a5fa" stroke="#0b1220" stroke-width="2" class="in" style="animation-delay:3.4s"/>
<circle cx="790" cy="196" r="4" fill="#f59e0b" stroke="#0b1220" stroke-width="2" class="in" style="animation-delay:3.6s"/>

<g class="in" style="animation-delay:2.4s">
  <rect x="506" y="254" width="288" height="140" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
  <rect x="518" y="266" width="86" height="18" rx="9" fill="#1e3a8a"/><text x="561" y="279" text-anchor="middle" style="font-size:10.5px;font-weight:600;fill:#bfdbfe">Java · Collections</text>
  <text x="782" y="279" text-anchor="end" style="font-size:10.5px;font-weight:600;fill:#86efac">▲ Harder next</text>
  <text class="q" x="518" y="304">Which collection keeps keys sorted?</text>
</g>
<g class="opt in" style="animation-delay:2.8s">
  <rect x="518" y="314" width="128" height="28" rx="7" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".14"/>
  <text x="530" y="332">A  HashMap</text>
</g>
<g class="opt pick in" style="animation-delay:3s">
  <rect x="654" y="314" width="128" height="28" rx="7" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".14"/>
  <text x="666" y="332">B  TreeMap</text>
  <path class="tick" d="M760 328l4 4 8-9" fill="none" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text class="fb in" x="518" y="370" style="animation-delay:4.3s">✓ Correct! The next question is a step harder.</text>
</svg>
