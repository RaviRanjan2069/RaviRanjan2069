<svg xmlns="http://www.w3.org/2000/svg" width="380" height="300" viewBox="0 0 380 300" role="img" aria-label="Mentora: AI learning platform, live">
<style>
  .name { font: 700 44px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #ffffff; letter-spacing: -1px; opacity: 0; animation: up .7s ease-out 1.1s forwards; }
  .tag { font: 500 15px 'Segoe UI', Ubuntu, sans-serif; fill: #dbe4ff; opacity: 0; animation: up .7s ease-out 1.4s forwards; }
  .pill { opacity: 0; animation: up .6s ease-out 1.7s forwards; }
  .pill text { font: 600 12px 'Segoe UI', Ubuntu, sans-serif; fill: #ffffff; }
  .tile { transform-origin: 190px 96px; animation: pop .6s cubic-bezier(.2, 1.4, .4, 1) .1s both, float 4s ease-in-out 1.2s infinite; }
  .m { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s ease-out .5s forwards; }
  .dot { animation: pulse 1.6s ease-in-out 2s infinite; transform-origin: 151px 251px; }
  .glow { animation: breathe 5s ease-in-out infinite; transform-origin: 190px 96px; }
  @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(1.5); } }
  @keyframes breathe { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: .6; transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#2f62e8"/><stop offset="1" stop-color="#6d28d9"/>
  </linearGradient>
  <radialGradient id="halo" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".14"/></pattern>
</defs>
<rect width="380" height="300" rx="18" fill="url(#bg)"/>
<rect width="380" height="300" rx="18" fill="url(#dots)"/>
<circle class="glow" cx="190" cy="96" r="88" fill="url(#halo)"/>
<g class="tile">
  <rect x="150" y="56" width="80" height="80" rx="22" fill="#ffffff"/>
  <rect x="158" y="64" width="64" height="64" rx="17" fill="#2f62e8"/>
  <path class="m" pathLength="1" d="M174 112V82l16 15 16-15v30" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text class="name" x="190" y="196" text-anchor="middle">Mentora</text>
<text class="tag" x="190" y="222" text-anchor="middle">AI learning platform · students &amp; teachers</text>
<g class="pill">
  <rect x="136" y="240" width="108" height="22" rx="11" fill="#ffffff" fill-opacity=".16" stroke="#ffffff" stroke-opacity=".35"/>
  <circle class="dot" cx="151" cy="251" r="4" fill="#4ade80"/>
  <text x="161" y="255">Live demo</text>
</g>
</svg>
